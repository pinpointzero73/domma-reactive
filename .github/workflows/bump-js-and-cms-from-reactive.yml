name: Bump domma-js and domma-cms when domma-reactive changes

on:
  push:
    branches: [ "main" ]
    paths:
      - 'package.json'
      - 'src/**'

env:
  TARGET_OWNER: pinpointzero73
  TARGET_JS: domma
  TARGET_CMS: domma-cms

jobs:
  bump-targets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: domma
            label: domma-js
          - repo: domma-cms
            label: domma-cms
    steps:
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone ${{ matrix.label }}
        env:
          TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${TARGET_OWNER}/${{ matrix.repo }}.git" target
          cd target
          git checkout -b "bump/reactive-${GITHUB_SHA::7}"

      - name: Bump ${{ matrix.label }} version (patch)
        run: |
          cd target
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));const parts=(p.version||'0.0.0').split('.').map(n=>parseInt(n||0));parts[2]=(parts[2]||0)+1;p.version=parts.join('.');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('new version',p.version)"
          git add package.json
          git commit -m "chore: bump ${{ matrix.label }} version after domma-reactive update" || echo "no changes to commit"
          git push --set-upstream origin HEAD

      - name: Create PR for ${{ matrix.label }}
        env:
          TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          cd target
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          TITLE="chore: bump ${{ matrix.label }} for domma-reactive updates"
          BODY="Automated version bump from domma-reactive updates. Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          jq -n --arg head "$BRANCH" --arg title "$TITLE" --arg body "$BODY" \
            '{head:$head, base:"main", title:$title, body:$body}' > /tmp/pr.json
          curl -sS -X POST -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TARGET_OWNER}/${{ matrix.repo }}/pulls" \
            -d @/tmp/pr.json
